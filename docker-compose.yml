services:
  api:
    image: ngodingpakeaiclone-api:latest
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: numa-api
    command: ["npx", "tsx", "watch", "src/index.ts"]
    ports:
      - "6655:6655"
    env_file:
      - path: .env
        required: false
      - path: apps/api/.env
        required: false
    environment:
      - PORT=6655
      - NODE_ENV=development
      # Database PostgreSQL selalu mengarah ke host komputer lokal
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}@host.docker.internal:5432/${POSTGRES_DB:-project_ai_planner}?schema=public
      - OPENAI_BASE_URL=${DOCKER_OPENAI_BASE_URL:-http://host.docker.internal:20128/v1}
      - FE_URL=${FE_URL:-http://localhost:3455}
      - ENABLE_EMAIL_AUTH=${ENABLE_EMAIL_AUTH:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/cli:/app/packages/cli:ro
      - ./node_modules:/app/node_modules
    restart: unless-stopped

  web:
    image: ngodingpakeaiclone-web:latest
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
      target: dev
    container_name: numa-web
    ports:
      - "3455:3455"
    environment:
      - VITE_PROXY_API_URL=http://api:6655
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./apps/web/tailwind.config.js:/app/apps/web/tailwind.config.js
      - ./node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

