services:
  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: numa-api
    command: ["npx", "tsx", "watch", "src/index.ts"]
    ports:
      - "6655:6655"
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      - PORT=6655
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:admin123@host.docker.internal:5432/project_ai_planner}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:20128/v1}
      - FE_URL=${FE_URL:-http://localhost:3455,https://numa.mrijal.my.id}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/cli:/app/packages/cli:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
      target: dev
    container_name: numa-web
    ports:
      - "3455:3455"
    environment:
      - VITE_PROXY_API_URL=http://api:6655
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    depends_on:
      - api
    restart: unless-stopped

  # Service database opsional jika ingin container Postgres mandiri
  # Jalankan dengan: docker compose --profile with-db up -d
  db:
    image: postgres:16-alpine
    container_name: numa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: project_ai_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles:
      - with-db

volumes:
  pgdata:
