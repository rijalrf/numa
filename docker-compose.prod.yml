services:
  api:
    image: ${DOCKERHUB_USERNAME}/numa-api:latest
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
      target: runner
    container_name: numa-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=6655
      # Database PostgreSQL berjalan langsung di host VPS
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin123}@host.docker.internal:5432/${POSTGRES_DB:-project_ai_planner}?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://numa.opendv.xyz}
      - FE_URL=${FE_URL:-https://numa.opendv.xyz,https://numa.mrijal.my.id}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:20128/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-ai-builder}
      - OPENAI_MODEL_REASONING=${OPENAI_MODEL_REASONING:-ai-builder}
      - OPENAI_MODEL_CHEAP=${OPENAI_MODEL_CHEAP:-ai-builder}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLI_DIR=/app/packages/cli
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:6655/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - numa-net

  web:
    image: ${DOCKERHUB_USERNAME}/numa-web:latest
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
      target: runner
      args:
        VITE_API_URL: ${VITE_API_URL:-https://numa.opendv.xyz}
    container_name: numa-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3455:3455"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - numa-net

networks:
  numa-net:
    name: numa-net
    driver: bridge
