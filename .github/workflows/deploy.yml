name: Deploy Numa to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verifikasi (typecheck, test, Prisma)
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Image ke Docker Hub
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/numa-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/numa-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dan Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/web/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/numa-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/numa-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pastikan direktori target di VPS tersedia
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: mkdir -p "${{ secrets.VPS_TARGET_DIR }}"

      - name: Salin docker-compose.prod.yml ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.VPS_TARGET_DIR }}
          overwrite: true

      - name: Eksekusi deployment remote via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          timeout: 600s
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_TARGET_DIR }}"

            echo "=== 1. Berpindah ke direktori project ==="
            cd "$APP_DIR"

            echo "=== 2. Memverifikasi keberadaan file .env produksi ==="
            if [ ! -f .env ]; then
              echo "Error: File .env produksi tidak ditemukan di $APP_DIR. Buat file .env dari .env.production.example terlebih dahulu."
              exit 1
            fi

            echo "=== 3. Login ke Docker Hub di VPS ==="
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            echo "=== 4. Mengambil (Pull) Image Terbaru dari Docker Hub ==="
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            # Image dipin ke commit yang sedang dideploy; rollback cukup menjalankan ulang dengan SHA lama.
            export NUMA_IMAGE_TAG="${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull

            echo "=== 5. Backup Database Sebelum Migrasi ==="
            env_value() { grep -E "^$1=" .env | tail -n 1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
            if command -v pg_dump >/dev/null 2>&1; then
              mkdir -p backups
              BACKUP_SQL="backups/numa-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}.sql"
              BACKUP_FILE="$BACKUP_SQL.gz"
              # Dump ke berkas dulu (bukan pipe) agar kegagalan pg_dump menghentikan deploy lewat set -e.
              PGPASSWORD="$(env_value POSTGRES_PASSWORD)" pg_dump -h 127.0.0.1 \
                -U "$(env_value POSTGRES_USER)" -f "$BACKUP_SQL" "$(env_value POSTGRES_DB)"
              test -s "$BACKUP_SQL"
              gzip -f "$BACKUP_SQL"
              echo "Backup tersimpan: $BACKUP_FILE"
              ls -1t backups/numa-*.sql.gz | tail -n +8 | xargs -r rm -f
            else
              echo "Peringatan: pg_dump tidak terpasang di VPS, backup dilewati. Pasang postgresql-client agar backup otomatis aktif."
            fi

            echo "=== 6. Menjalankan Migrasi Database Prisma (sebelum container baru aktif) ==="
            # Container sementara dari image baru; bila migrasi gagal, script berhenti dan container lama tetap berjalan.
            docker compose -f docker-compose.prod.yml run --rm --no-deps api npx prisma migrate deploy --schema=./prisma/schema.prisma

            echo "=== 7. Menjalankan Container Produksi ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== 7b. Membersihkan Image Docker Lama ==="
            docker image prune -f

            echo "=== 8. Verifikasi Kesehatan Backend ==="
            sleep 5
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3455/health || true)
            if [ "$HEALTH_STATUS" != "200" ]; then
              echo "Peringatan: Cek /health mengembalikan HTTP $HEALTH_STATUS. Memeriksa status container..."
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi

            echo "=== Deployment Selesai dengan Berhasil ==="
