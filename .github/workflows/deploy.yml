name: Deploy PakeAI to VPS

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Eksekusi deployment remote via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          timeout: 600s
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR || '/var/www/pakeai' }}"

            echo "=== 1. Berpindah ke direktori project ==="
            cd "$APP_DIR"

            echo "=== 2. Mengambil commit terbaru dari branch main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 3. Memverifikasi keberadaan file .env produksi ==="
            if [ ! -f .env ]; then
              echo "Error: File .env produksi tidak ditemukan di $APP_DIR. Buat file .env dari .env.production.example terlebih dahulu."
              exit 1
            fi

            echo "=== 4. Build dan restart container produksi ==="
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "=== 5. Menjalankan migrasi database Prisma ==="
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy --schema=./prisma/schema.prisma

            echo "=== 6. Membersihkan image Docker yang tidak terpakai ==="
            docker image prune -f

            echo "=== 7. Verifikasi kesehatan backend ==="
            sleep 5
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3455/health || true)
            if [ "$HEALTH_STATUS" != "200" ]; then
              echo "Peringatan: Cek /health mengembalikan HTTP $HEALTH_STATUS. Memeriksa status container..."
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi

            echo "=== Deployment Selesai dengan Berhasil ==="
